<meta name="robots" content="noindex">

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Estudios</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#0a4d8c;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:18px;
    border:none;
    border-radius:6px;
    background:#0a4d8c;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#083866;
}

.hidden{
    display:none;
}

.info{
    background:#eef6ff;
    border-radius:8px;
    padding:15px;
    margin-bottom:20px;
}

.estudio{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #e5e5e5;
    font-size:18px;
}

.pendiente{
    color:#d35400;
    font-weight:bold;
}

.completo{
    color:green;
    font-weight:bold;
}

.progreso{
    width:100%;
    height:25px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progreso-barra{
    width:0%;
    height:100%;
    background:#28a745;
    transition:width .5s;
}

.finalizado{
    margin-top:20px;
    padding:15px;
    text-align:center;
    background:#d4edda;
    color:#155724;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

```
<div id="pantallaIngreso">

    <h1>Consulta de Estudios</h1>

    <p>
        Ingrese su DNI para consultar el estado de sus estudios.
    </p>

    <input
        type="text"
        id="dni"
        placeholder="Ingrese su DNI">

    <button onclick="consultar()">
        Consultar Estado
    </button>

</div>

<div id="pantallaEstudios" class="hidden">

    <h1>Estado de Estudios</h1>

    <div class="info">
        <strong>DNI:</strong>
        <span id="dniMostrado"></span>
        <br><br>

        <strong>Examen:</strong>
        EX-125487
        <br><br>

        <strong>Fecha:</strong>
        <span id="fecha"></span>
    </div>

    <div class="progreso">
        <div id="barra" class="progreso-barra"></div>
    </div>

    <div id="listaEstudios"></div>

    <div id="mensajeFinal"></div>

</div>
```

</div>

<script>

const estudios = [
    "Laboratorio",
    "Radiografía",
    "Electrocardiograma",
    "Audiometría",
    "Psicología"
];

function consultar(){

    const dni = document.getElementById("dni").value;

    if(dni.trim() === ""){
        alert("Ingrese un DNI");
        return;
    }

    document.getElementById("dniMostrado").innerText = dni;

    document.getElementById("fecha").innerText =
        new Date().toLocaleDateString("es-AR");

    document.getElementById("pantallaIngreso")
        .classList.add("hidden");

    document.getElementById("pantallaEstudios")
        .classList.remove("hidden");

    iniciarEstudios();
}

function iniciarEstudios(){

    const lista =
        document.getElementById("listaEstudios");

    lista.innerHTML = "";

    estudios.forEach((nombre,index)=>{

        const fila = document.createElement("div");

        fila.className = "estudio";

        fila.innerHTML =
        `
        <span>${nombre}</span>
        <span id="estado${index}"
              class="pendiente">
              ⏳ Pendiente
        </span>
        `;

        lista.appendChild(fila);

    });

    completarEstudios();
}

function completarEstudios(){

    let completados = 0;

    estudios.forEach((item,index)=>{

        setTimeout(()=>{

            const estado =
                document.getElementById(`estado${index}`);

            estado.innerHTML =
                "✅ Completado";

            estado.className =
                "completo";

            completados++;

            const porcentaje =
                (completados / estudios.length) * 100;

            document.getElementById("barra")
                .style.width = porcentaje + "%";

            if(completados === estudios.length){

                document.getElementById("mensajeFinal")
                    .innerHTML =
                    `
                    <div class="finalizado">
                        ✅ Todos los estudios han sido completados
                    </div>
                    `;
            }

        }, (index + 1) * 5000);

    });

}

</script>

</body>
</html>
